<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>樂活健康電視 LOHAS TV</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-size: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .senior-tap { min-height: 56px; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body class="bg-amber-50 text-stone-900 font-sans min-h-screen flex flex-col pb-10">

  <!-- 頂部導航列 -->
  <header class="bg-emerald-800 text-white px-4 md:px-8 py-3 flex justify-between items-center shadow-md sticky top-0 z-50">
    <div class="flex items-center space-x-3">
      <span class="text-3xl">📺</span>
      <div>
        <h1 class="text-2xl font-black tracking-wide">樂活健康電視</h1>
        <p class="text-emerald-200 text-xs font-medium">長者專屬影音・廣播級粵語指導</p>
      </div>
    </div>

    <!-- 語音搜尋按鈕 -->
    <button id="voiceBtn" onclick="toggleVoiceSearch()" class="senior-tap bg-amber-400 hover:bg-amber-500 text-stone-950 font-black px-5 py-2.5 rounded-full flex items-center gap-2 shadow-lg transition active:scale-95 border-2 border-amber-300">
      <span id="voiceIcon" class="text-2xl">🎙️</span>
      <span id="voiceText" class="text-lg">按此講嘢 (如：腰痛)</span>
    </button>
  </header>

  <!-- 長者 5 大痛點直通車 (獨立分開 5 粒按鈕，點擊 0 延遲精準開播) -->
  <section class="bg-emerald-900 px-4 md:px-8 py-3 text-white shadow-inner">
    <div class="max-w-7xl mx-auto flex items-center justify-between flex-wrap gap-2">
      <span class="text-xs font-bold text-emerald-200 uppercase tracking-wider flex items-center gap-1">
        ⚡ 痛點直通車：
      </span>
      <div class="flex gap-2 overflow-x-auto w-full md:w-auto pb-1 scrollbar-none">
        <button onclick="triggerDirectPainPoint('濁親')" class="bg-emerald-700 hover:bg-amber-500 hover:text-stone-950 text-white px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap shadow transition flex items-center gap-1.5 active:scale-95">
          🗣️ 成日濁親 (健口操)
        </button>
        <button onclick="triggerDirectPainPoint('膝蓋痛')" class="bg-emerald-700 hover:bg-amber-500 hover:text-stone-950 text-white px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap shadow transition flex items-center gap-1.5 active:scale-95">
          🦵 菠蘿蓋痛 (防痛操)
        </button>
        <button onclick="triggerDirectPainPoint('防跌')" class="bg-emerald-700 hover:bg-amber-500 hover:text-stone-950 text-white px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap shadow transition flex items-center gap-1.5 active:scale-95">
          🚶 行路唔穩 (防跌操)
        </button>
        <button onclick="triggerDirectPainPoint('腰痛')" class="bg-amber-400 text-stone-950 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap shadow transition flex items-center gap-1.5 active:scale-95">
          🧘 腰痠背痛 (拉腰操)
        </button>
        <button onclick="triggerDirectPainPoint('瞓唔著')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap shadow transition flex items-center gap-1.5 active:scale-95">
          😴 瞓唔著 (助眠穴位)
        </button>
      </div>
    </div>
  </section>

  <!-- 主畫面 -->
  <main class="flex-1 p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 max-w-7xl mx-auto w-full">
    
    <!-- 左側：主播放器與行動處方 (佔 7 欄) -->
    <div class="lg:col-span-7 flex flex-col gap-5">
      
      <!-- 播放器 -->
      <div class="bg-black rounded-2xl overflow-hidden shadow-xl aspect-video relative border-2 border-stone-800">
        <iframe id="mainPlayer" class="w-full h-full" src="https://www.youtube.com/embed/S2EAkhB4XEk?autoplay=1&rel=0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>

      <!-- AI 處方卡片 -->
      <div id="prescriptionCard" class="bg-white border-2 border-emerald-500 rounded-2xl p-5 shadow-lg">
        <div class="flex items-center justify-between mb-3 border-b border-stone-200 pb-3">
          <div class="flex items-center gap-2">
            <span class="text-3xl">🩺</span>
            <div>
              <span class="text-xs bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded">樂活智能處方</span>
              <h2 id="aiActionTitle" class="text-xl md:text-2xl font-black text-emerald-950">坐姿膝關節強化運動</h2>
            </div>
          </div>
          <button onclick="replayVoiceSummary()" class="bg-amber-100 hover:bg-amber-200 text-stone-900 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1">
            🔊 聽多次
          </button>
        </div>

        <p id="aiVoiceSummary" class="text-stone-900 text-base md:text-lg font-medium mb-3 bg-emerald-50 p-3 rounded-xl border border-emerald-200 leading-relaxed">
          菠蘿蓋痛唔好勉強企喺度行，坐喺穩陣椅子上伸展大腿肌肉最安全！
        </p>

        <!-- 動作步驟 -->
        <div class="space-y-1.5 mb-4">
          <p class="text-xs font-bold text-stone-500 uppercase tracking-wide">動作要點：</p>
          <ul id="aiQuickSteps" class="space-y-1.5 text-stone-800 font-bold text-base md:text-lg">
            <li class="flex items-center gap-2"><span class="w-6 h-6 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xs flex-shrink-0">1</span><span>坐穩椅子，單腳慢慢向前伸直抬平</span></li>
            <li class="flex items-center gap-2"><span class="w-6 h-6 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xs flex-shrink-0">2</span><span>腳尖向上勾起，維持 5 秒感受大腿用力</span></li>
            <li class="flex items-center gap-2"><span class="w-6 h-6 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xs flex-shrink-0">3</span><span>慢慢放低，左右腳輪流做 8 次</span></li>
          </ul>
        </div>

        <!-- 閉環：WhatsApp 家庭報平安 + 計時 -->
        <div class="flex flex-col sm:flex-row items-center gap-3 pt-3 border-t border-stone-100">
          <button id="whatsappBtn" onclick="notifyFamily()" class="w-full sm:w-auto flex-1 senior-tap bg-emerald-600 hover:bg-emerald-700 text-white font-black px-4 py-2.5 rounded-xl shadow transition flex items-center justify-center gap-2">
            <span class="text-xl">✅</span> 完成運動！話畀仔女知
          </button>
          <button onclick="startExerciseTimer(180)" id="timerBtn" class="w-full sm:w-auto senior-tap bg-stone-100 hover:bg-stone-200 text-stone-800 font-bold px-4 py-2.5 rounded-xl border border-stone-300 flex items-center justify-center gap-1.5 text-sm">
            ⏱️ 3分鐘跟練計時
          </button>
        </div>
      </div>

    </div>

    <!-- 右側：影片列表 (佔 5 欄) -->
    <div class="lg:col-span-5 flex flex-col bg-white rounded-2xl shadow-md border border-stone-200 p-4">
      
      <!-- 分類標籤 -->
      <div class="flex gap-2 pb-3 mb-3 border-b border-stone-200 overflow-x-auto" id="categoryTabs">
        <button onclick="switchCategory('全部')" class="cat-btn px-4 py-2 rounded-xl text-sm font-bold bg-emerald-700 text-white transition">全部</button>
        <button onclick="switchCategory('座椅伸展操')" class="cat-btn px-4 py-2 rounded-xl text-sm font-bold bg-stone-100 hover:bg-emerald-100 text-stone-700 transition">🪑 座椅操</button>
        <button onclick="switchCategory('溫和太極')" class="cat-btn px-4 py-2 rounded-xl text-sm font-bold bg-stone-100 hover:bg-emerald-100 text-stone-700 transition">☯️ 太極</button>
        <button onclick="switchCategory('養生飲食')" class="cat-btn px-4 py-2 rounded-xl text-sm font-bold bg-stone-100 hover:bg-emerald-100 text-stone-700 transition">🥗 飲食</button>
      </div>

      <!-- 滾動清單 -->
      <div id="videoList" class="flex-1 overflow-y-auto space-y-3 max-h-[640px] pr-1"></div>
    </div>

  </main>

  <script>
    const API_BASE_URL = 'http://localhost:5000';

    // 5 大長者痛點前端直連對照表 (0ms 延遲，100% 絕對精準)
    const DIRECT_PRESETS = {
      '濁親': {
        videoId: 'gkKbsoXetf8',
        title: '🗣️ 長者健口操・預防進食嗆咳',
        summary: '食嘢容易濁親多數因為喉部肌肉退化。跟住做吞嚥健口操，可以加強吞嚥力量！',
        steps: ['頭部慢慢向左右轉動放鬆頸肌', '鼓起兩腮含氣 3 秒，再慢慢吹氣', '伸出舌頭向前、向上伸展各 3 次']
      },
      '膝蓋痛': {
        videoId: 'S2EAkhB4XEk',
        title: '🦵 坐姿膝關節強化運動',
        summary: '菠蘿蓋痛唔好勉強企喺度行，坐喺穩陣椅子上伸展大腿肌肉最安全！',
        steps: ['坐穩椅子，單腳慢慢向前伸直抬平', '腳尖向上勾起，維持 5 秒感受大腿用力', '慢慢放低，左右腳輪流做 8 次']
      },
      '防跌': {
        videoId: 'YfWmJpWkj_0',
        title: '🚶 長者扶椅防跌訓練',
        summary: '步履唔穩容易跌倒，雙手扶住穩固椅背做提踵同抬腿，有助提升平衡力。',
        steps: ['雙手扶穩椅背，背部挺直', '慢慢抬起腳跟腳尖著地，維持 3 秒後放下', '左右單腳微抬離地 3 秒，鍛鍊核心平衡']
      },
      '腰痛': {
        videoId: 'Kj7CjmXj1X0',
        title: '🧘 4分鐘長者腰部伸展・舒緩腰痛',
        summary: '腰痛千祈唔好劇烈彎腰！坐在椅子上做溫和的軀幹旋轉與伸展，能有效放鬆緊繃的腰背肌肉。',
        steps: ['端坐在椅子上，雙手輕扶大腿', '上身保持挺直，緩慢向左轉動 5 秒感受腰背舒展', '回到中間，再緩慢轉向右邊，左右各做 5 次']
      },
      '瞓唔著': {
        videoId: 'SgPZ6RPQ7fc',
        title: '😴 睡前安神・遠離失眠穴位按壓',
        summary: '瞓唔著唔好心急，睡前坐在床邊按壓神門穴與內關穴，幫助安定心神、放鬆入睡。',
        steps: ['用拇指輕輕按壓手腕內側的神門穴 1 分鐘', '深呼吸放鬆肩頸，轉換按壓內關穴', '雙腳自然垂放，放空思緒感受呼吸']
      }
    };

    let currentActionTitle = "坐姿膝關節強化運動";
    let lastVoiceText = "菠蘿蓋痛唔好勉強企喺度行，坐喺穩陣椅子上伸展大腿肌肉最安全！";

    // 強制註銷舊有 Service Worker 與清理所有快取
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let reg of registrations) { reg.unregister(); }
      });
    }
    if ('caches' in window) {
      caches.keys().then(names => {
        for (let name of names) caches.delete(name);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadVideosFrom5000('全部');
    });

    // 點擊痛點直通車 (前端直接瞬間執行，零延遲更換影片與處方)
    function triggerDirectPainPoint(key) {
      const plan = DIRECT_PRESETS[key];
      if (!plan) return;

      currentActionTitle = plan.title;
      lastVoiceText = plan.summary;

      document.getElementById('aiActionTitle').innerText = plan.title;
      document.getElementById('aiVoiceSummary').innerText = plan.summary;
      document.getElementById('voiceText').innerText = `已載入：${plan.title}`;

      const stepsContainer = document.getElementById('aiQuickSteps');
      stepsContainer.innerHTML = plan.steps.map((s, idx) => `
        <li class="flex items-center gap-2">
          <span class="w-6 h-6 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xs flex-shrink-0">${idx+1}</span>
          <span>${s}</span>
        </li>
      `).join('');

      document.getElementById('mainPlayer').src = `https://www.youtube.com/embed/${plan.videoId}?autoplay=1&rel=0`;
      speakCantonese(plan.summary);
    }

    async function loadVideosFrom5000(category) {
      const container = document.getElementById('videoList');
      try {
        const url = category === '全部'
          ? `${API_BASE_URL}/api/videos`
          : `${API_BASE_URL}/api/videos?category=${encodeURIComponent(category)}`;

        const res = await fetch(url);
        const data = await res.json();

        if (data.success && data.videos.length > 0) {
          renderVideoList(data.videos);
        }
      } catch (err) {
        console.error('API 讀取異常:', err);
      }
    }

    function renderVideoList(videos) {
      const container = document.getElementById('videoList');
      container.innerHTML = videos.map(v => `
        <div onclick="playVideo('${v.videoId}', '${v.title.replace(/'/g, "\\'")}')" class="flex gap-3 p-3 rounded-xl bg-stone-50 hover:bg-emerald-50 cursor-pointer border border-stone-200 transition shadow-sm hover:shadow">
          <img src="${v.thumbnail}" class="w-28 h-20 object-cover rounded-lg flex-shrink-0 bg-stone-200" alt="縮圖">
          <div class="flex flex-col justify-between overflow-hidden">
            <h3 class="font-bold text-stone-900 text-sm line-clamp-2 leading-snug">${v.title}</h3>
            <div class="flex items-center gap-2 text-xs text-stone-500 mt-1">
              <span class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-bold">${v.category}</span>
              <span>⏱ ${v.durationText || ''}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function switchCategory(cat) {
      document.querySelectorAll('.cat-btn').forEach(b => {
        if (b.innerText.includes(cat)) {
          b.className = 'cat-btn px-4 py-2 rounded-xl text-sm font-bold bg-emerald-700 text-white transition';
        } else {
          b.className = 'cat-btn px-4 py-2 rounded-xl text-sm font-bold bg-stone-100 hover:bg-emerald-100 text-stone-700 transition';
        }
      });
      loadVideosFrom5000(cat);
    }

    function playVideo(videoId, title) {
      if (!videoId) return;
      document.getElementById('mainPlayer').src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
      if (title) currentActionTitle = title;
    }

    function toggleVoiceSearch() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        const text = prompt('請說出症狀：', '腰痛');
        if (text) checkVoiceTrigger(text);
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'zh-HK';
      const voiceBtn = document.getElementById('voiceBtn');
      const voiceText = document.getElementById('voiceText');

      recognition.onstart = () => {
        voiceBtn.className = 'senior-tap bg-red-600 text-white font-black px-5 py-2.5 rounded-full flex items-center gap-2 shadow-lg animate-pulse';
        voiceText.innerText = '聽緊你講嘢...';
      };

      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        voiceText.innerText = `「${transcript}」`;
        checkVoiceTrigger(transcript);
      };

      recognition.onerror = () => {
        voiceText.innerText = '聽唔清，請再試';
      };

      recognition.onend = () => {
        setTimeout(() => {
          voiceBtn.className = 'senior-tap bg-amber-400 hover:bg-amber-500 text-stone-950 font-black px-5 py-2.5 rounded-full flex items-center gap-2 shadow-lg transition active:scale-95 border-2 border-amber-300';
          voiceText.innerText = '按此講嘢 (如：腰痛)';
        }, 3000);
      };

      recognition.start();
    }

    function checkVoiceTrigger(query) {
      if (query.includes('腰') || query.includes('背')) {
        triggerDirectPainPoint('腰痛');
      } else if (query.includes('瞓') || query.includes('眠')) {
        triggerDirectPainPoint('瞓唔著');
      } else if (query.includes('濁') || query.includes('咳') || query.includes('吞')) {
        triggerDirectPainPoint('濁親');
      } else if (query.includes('膝') || query.includes('菠蘿蓋') || query.includes('關節')) {
        triggerDirectPainPoint('膝蓋痛');
      } else if (query.includes('跌') || query.includes('行') || query.includes('穩')) {
        triggerDirectPainPoint('防跌');
      } else {
        triggerDirectPainPoint('膝蓋痛');
      }
    }

    function speakCantonese(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-HK';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      }
    }

    function replayVoiceSummary() {
      if (lastVoiceText) speakCantonese(lastVoiceText);
    }

    function notifyFamily() {
      const message = `仔女你好！我啱啱喺「樂活健康電視」跟住做咗「${currentActionTitle}」，身體感覺唔錯，同你報個平安！❤️`;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`, '_blank');
    }

    function startExerciseTimer(seconds) {
      const timerBtn = document.getElementById('timerBtn');
      let remain = seconds;
      timerBtn.disabled = true;
      
      const interval = setInterval(() => {
        const mins = Math.floor(remain / 60);
        const secs = remain % 60;
        timerBtn.innerText = `⏱️ 仲有 ${mins}:${secs < 10 ? '0' : ''}${secs}`;
        remain--;

        if (remain < 0) {
          clearInterval(interval);
          timerBtn.disabled = false;
          timerBtn.innerText = '🎉 運動完成！做得好好！';
          speakCantonese('做得好好！三分鐘運動完成喇，飲啖溫水休息下啦。');
        }
      }, 1000);
    }
  </script>
</body>
</html>
