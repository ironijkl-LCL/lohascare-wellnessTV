<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LOHAS TV - 樂活智能長者健康系統</title>

  <!-- Google Fonts: 適合長者清晰閱讀的字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@500;700;900&display=swap" rel="stylesheet">

  <!-- MediaPipe Pose CDN (端側姿態分析，免費零伺服器負擔) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --primary-green: #064E3B;
      --accent-jade: #10B981;
      --warm-amber: #F59E0B;
      --bg-cream: #F8FAFC;
      --card-white: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #475569;
      --danger-red: #DC2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans HK', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-cream);
      color: var(--text-main);
      padding-bottom: 90px;
    }

    /* 頂部導航欄 (高對比、大字體) */
    header {
      background: linear-gradient(135deg, var(--primary-green), #047857);
      color: white;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .brand-title {
      font-size: 26px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .family-badge {
      background: rgba(255,255,255,0.2);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.4);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    /* 每日問候與 Streak 徽章 */
    .greeting-card {
      background: var(--card-white);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(6,78,59,0.05);
      border: 2px solid #E2E8F0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .greeting-text h2 {
      font-size: 24px;
      font-weight: 900;
      color: var(--primary-green);
      margin-bottom: 6px;
    }
    .greeting-text p {
      font-size: 18px;
      color: var(--text-muted);
    }
    .streak-pill {
      background: #FEF3C7;
      color: #92400E;
      border: 2px solid var(--warm-amber);
      border-radius: 20px;
      padding: 12px 18px;
      font-size: 20px;
      font-weight: 900;
      text-align: center;
    }

    /* 搜尋與症狀快選 */
    .search-box {
      margin-bottom: 20px;
    }
    .search-input {
      width: 100%;
      padding: 16px 20px;
      font-size: 20px;
      border-radius: 16px;
      border: 2px solid #CBD5E1;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--accent-jade);
    }
    .tag-container {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 10px 0;
    }
    .tag-btn {
      background: #E2E8F0;
      color: var(--text-main);
      padding: 10px 20px;
      border-radius: 30px;
      border: none;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .tag-btn.active {
      background: var(--primary-green);
      color: white;
    }

    /* 運動卡片網格 */
    .workout-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .workout-card {
      background: var(--card-white);
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid #E2E8F0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .workout-card:hover {
      transform: translateY(-4px);
    }
    .workout-thumb {
      height: 160px;
      background: #047857;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      color: white;
    }
    .workout-info {
      padding: 20px;
    }
    .workout-title {
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 8px;
      color: var(--primary-green);
    }
    .workout-meta {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    .start-btn {
      width: 100%;
      background: var(--accent-jade);
      color: white;
      padding: 14px;
      font-size: 20px;
      font-weight: 900;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    /* 底部功能欄 (語音、SOS) */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-white);
      box-shadow: 0 -5px 25px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-around;
      padding: 14px 20px;
      z-index: 100;
    }
    .action-btn {
      flex: 1;
      margin: 0 8px;
      padding: 16px;
      border-radius: 16px;
      font-size: 20px;
      font-weight: 900;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-voice {
      background: #3B82F6;
      color: white;
    }
    .btn-sos {
      background: var(--danger-red);
      color: white;
    }

    /* 通用彈窗 Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(5px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-card {
      background: white;
      border-radius: 28px;
      padding: 30px;
      width: 100%;
      max-width: 500px;
      text-align: center;
    }
    .modal-title {
      font-size: 26px;
      font-weight: 900;
      margin-bottom: 20px;
      color: var(--primary-green);
    }

    /* 運動前篩查樣式 */
    .screening-q {
      font-size: 22px;
      font-weight: 700;
      margin: 20px 0;
      color: #1E293B;
    }
    .choice-btns {
      display: flex;
      gap: 15px;
      margin-top: 15px;
    }
    .choice-btn {
      flex: 1;
      padding: 18px;
      font-size: 22px;
      font-weight: 900;
      border-radius: 16px;
      border: none;
      cursor: pointer;
    }
    .btn-safe { background: #D1FAE5; color: #065F46; }
    .btn-warn { background: #FEE2E2; color: #991B1B; }

    /* RPE 評估樣式 */
    .rpe-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px 0;
    }
    .rpe-btn {
      background: #F1F5F9;
      border: 2px solid #CBD5E1;
      padding: 16px;
      font-size: 20px;
      font-weight: 700;
      border-radius: 16px;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .rpe-btn:hover {
      border-color: var(--accent-jade);
      background: #ECFDF5;
    }

    /* MediaPipe AI 姿態糾正畫面 */
    #aiCameraModal .modal-card {
      max-width: 700px;
      padding: 20px;
    }
    .camera-wrapper {
      position: relative;
      width: 100%;
      height: 380px;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 15px;
    }
    #cameraFeed {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #poseCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }
    .ai-feedback-banner {
      background: #FEF3C7;
      color: #92400E;
      padding: 15px;
      border-radius: 12px;
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 15px;
    }

    /* SOS 10秒倒數全螢幕 */
    #sosModal {
      background: var(--danger-red);
    }
    .sos-content {
      color: white;
      text-align: center;
    }
    .sos-countdown {
      font-size: 80px;
      font-weight: 900;
      color: #FEF08A;
      margin: 20px 0;
    }
    .btn-cancel-sos {
      background: white;
      color: var(--danger-red);
      font-size: 26px;
      font-weight: 900;
      padding: 22px 35px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <!-- 頂部導航 -->
  <header>
    <div class="brand-title">
      🌿 LOHAS TV 樂活健康
    </div>
    <div class="family-badge" id="pairCodeDisplay" onclick="openPairingModal()">
      👨‍👩‍👧 看顧碼: 載入中...
    </div>
  </header>

  <div class="container">
    <!-- 智能問候卡片 (含記憶 + 連續天數) -->
    <div class="greeting-card">
      <div class="greeting-text">
        <h2 id="seniorGreeting">早晨！今日想舒展邊度？</h2>
        <p id="healthAdvice">上次提過膝頭哥痛，今日做套輕柔膝操啦！</p>
      </div>
      <div class="streak-pill">
        🔥 連續 <span id="streakCount">0</span> 日
      </div>
    </div>

    <!-- 搜尋與症狀標籤 -->
    <div class="search-box">
      <input type="text" class="search-input" id="workoutSearch" placeholder="🔍 搜尋運動或症狀 (例: 膝痛、五十肩、強心肺)...">
      <div class="tag-container">
        <button class="tag-btn active" onclick="filterWorkout('ALL')">全部運動</button>
        <button class="tag-btn" onclick="filterWorkout('KNEE')">🦵 護膝防跌</button>
        <button class="tag-btn" onclick="filterWorkout('BACK')">🧘 舒緩腰背</button>
        <button class="tag-btn" onclick="filterWorkout('SHOULDER')">💪 肩頸放鬆</button>
        <button class="tag-btn" onclick="filterWorkout('CARDIO')">❤️ 溫和心肺</button>
      </div>
    </div>

    <!-- 運動項目列表 -->
    <div class="workout-grid" id="workoutList">
      <!-- 動態載入運動項目 -->
    </div>
  </div>

  <!-- 底部語音與 SOS -->
  <div class="bottom-bar">
    <button class="action-btn btn-voice" onclick="toggleVoiceAssistant()">
      🎙️ 語音對話 / 搵運動
    </button>
    <button class="action-btn btn-sos" id="sosTriggerBtn">
      🆘 求救按鈕 (長按3秒)
    </button>
  </div>

  <!-- Modal 1: 運動前 3 題健康篩查 (PAR-Q) -->
  <div class="modal-overlay" id="screeningModal">
    <div class="modal-card">
      <div class="modal-title">🩺 運動前健康評估</div>
      <div class="screening-q" id="screeningQuestionText">今日身體有無頭暈？</div>
      <div class="choice-btns">
        <button class="choice-btn btn-safe" onclick="handleScreeningAnswer(false)">無，好精神</button>
        <button class="choice-btn btn-warn" onclick="handleScreeningAnswer(true)">有啲唔舒服</button>
      </div>
    </div>
  </div>

  <!-- Modal 2: 運動後 RPE 自評 -->
  <div class="modal-overlay" id="rpeModal">
    <div class="modal-card">
      <div class="modal-title">👏 運動完成！感覺點樣？</div>
      <p style="font-size: 18px; color: var(--text-muted);">話畀 AI 知，下次為你微調動作難度：</p>
      <div class="rpe-options">
        <button class="rpe-btn" onclick="submitRPE(1)">😊 1. 好輕鬆 (完全唔索氣)</button>
        <button class="rpe-btn" onclick="submitRPE(2)">😃 2. 幾輕鬆 (微暖舒適)</button>
        <button class="rpe-btn" onclick="submitRPE(3)">😅 3. 剛剛好 (最佳運動效果)</button>
        <button class="rpe-btn" onclick="submitRPE(4)">😓 4. 幾辛苦 (有啲攰)</button>
        <button class="rpe-btn" onclick="submitRPE(5)">😰 5. 好辛苦 (好索氣)</button>
      </div>
    </div>
  </div>

  <!-- Modal 3: MediaPipe AI 姿態糾正鏡頭視窗 -->
  <div class="modal-overlay" id="aiCameraModal">
    <div class="modal-card">
      <div class="modal-title">🤖 AI 動作守護教練</div>
      <div class="ai-feedback-banner" id="aiVoiceFeedback">鏡頭準備中，請站於鏡頭前...</div>
      <div class="camera-wrapper">
        <video id="cameraFeed" playsinline autoplay muted></video>
        <canvas id="poseCanvas"></canvas>
      </div>
      <button class="start-btn" style="background:#EF4444;" onclick="stopExerciseWithAI()">完成運動</button>
    </div>
  </div>

  <!-- Modal 4: 10 秒 SOS 倒數全螢幕防誤觸 -->
  <div class="modal-overlay" id="sosModal">
    <div class="sos-content">
      <h1 style="font-size: 36px; font-weight: 900;">⚠️ 正在準備發送求救訊號</h1>
      <div class="sos-countdown" id="sosTimer">10</div>
      <p style="font-size: 22px; margin-bottom: 30px;">即將透過雲端與 WhatsApp 通知家人及分享 GPS 座標</p>
      <button class="btn-cancel-sos" onclick="abortSOS()">【撳錯咗】立即取消</button>
    </div>
  </div>

  <!-- Modal 5: 家人看顧配對碼彈窗 -->
  <div class="modal-overlay" id="pairingModal" onclick="closePairingModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-title">👨‍👩‍👧 家人看顧配對</div>
      <p style="font-size: 18px; color: var(--text-muted); margin-bottom: 20px;">
        仔女於手機開啟 Dashboard 輸入此看顧碼，即可遙距查看運動進度與接收警報：
      </p>
      <div style="font-size: 42px; font-weight: 900; letter-spacing: 6px; color: var(--primary-green); background: #ECFDF5; padding: 15px; border-radius: 16px; margin-bottom: 20px;" id="pairCodeModalText">
        ------
      </div>
      <button class="start-btn" onclick="document.getElementById('pairingModal').style.display='none'">明白關閉</button>
    </div>
  </div>

  <!-- Firebase v10 Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    // 1. 初始化專案所提供的 Firebase 配置
    const firebaseConfig = {
      apiKey: "AIzaSyCQq7Ro4x4RJEYpSuFR-LLVV0iXS3LJRZE",
      authDomain: "lohascare-wellnesstv.firebaseapp.com",
      projectId: "lohascare-wellnesstv",
      storageBucket: "lohascare-wellnesstv.firebasestorage.app",
      messagingSenderId: "1007645511334",
      appId: "1:1007645511334:web:d74b422ab2ae2c4f1fee67",
      measurementId: "G-55LQB7GVXT"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentElderUid = null;
    let currentPairCode = null;

    // 2. 長者免密碼登入與看顧碼初始化
    async function initSession() {
      try {
        const userCred = await signInAnonymously(auth);
        currentElderUid = userCred.user.uid;
        
        let localCode = localStorage.getItem("lohas_pair_code");
        if (!localCode) {
          localCode = Math.floor(100000 + Math.random() * 900000).toString();
          localStorage.setItem("lohas_pair_code", localCode);
        }
        currentPairCode = localCode;

        document.getElementById("pairCodeDisplay").innerText = `👨‍👩‍👧 看顧碼: ${currentPairCode}`;
        document.getElementById("pairCodeModalText").innerText = currentPairCode;

        // 同步至 Firestore
        await setDoc(doc(db, "elders", currentElderUid), {
          elderUid: currentElderUid,
          pairingCode: currentPairCode,
          lastActiveAt: serverTimestamp()
        }, { merge: true });

        // 載入 Streak
        const streak = parseInt(localStorage.getItem("lohas_streak") || "3", 10);
        document.getElementById("streakCount").innerText = streak;

        // 檢查歷史記憶並主動關懷
        const lastSymptom = localStorage.getItem("lohas_last_symptom");
        if (lastSymptom) {
          document.getElementById("healthAdvice").innerText = `上次你提過有${lastSymptom}，今日為你揀選咗對應舒緩操！`;
        }
      } catch (err) {
        console.warn("Firebase 離線模式運作中:", err);
        document.getElementById("pairCodeDisplay").innerText = `👨‍👩‍👧 看顧碼: 842913`;
        document.getElementById("pairCodeModalText").innerText = "842913";
      }
    }

    // 3. SOS 寫入資料庫
    window.pushSOSAlertToFirestore = async function(status, gpsCoords = null) {
      if (!currentElderUid) return;
      const alertId = `sos_${Date.now()}`;
      try {
        await setDoc(doc(db, "emergency_alerts", alertId), {
          alertId,
          elderUid: currentElderUid,
          status, // 'ACTIVE' or 'CANCELLED'
          gps: gpsCoords,
          createdAt: serverTimestamp()
        });
      } catch (e) {
        console.error("SOS Firestore error:", e);
      }
    };

    // 4. 儲存運動打卡與 RPE 到 Firestore
    window.saveSessionToFirestore = async function(rpeScore, workoutId) {
      const today = new Date().toISOString().split("T")[0];
      let currentStreak = parseInt(localStorage.getItem("lohas_streak") || "0", 10) + 1;
      localStorage.setItem("lohas_streak", currentStreak);
      document.getElementById("streakCount").innerText = currentStreak;

      if (!currentElderUid) return;
      try {
        await setDoc(doc(db, "elders", currentElderUid, "daily_logs", today), {
          date: today,
          rpeScore,
          workoutId,
          completedAt: serverTimestamp()
        }, { merge: true });
      } catch (e) {
        console.error("Firestore log error:", e);
      }
    };

    initSession();
  </script>

  <!-- 前端交互與業務邏輯 Script -->
  <script>
    // 內建運動資料庫 (支援即時篩選與搜尋)
    const WORKOUTS = [
      { id: "knee_1", title: "經典長者坐姿膝關節操", category: "KNEE", duration: "8 分鐘", level: "初階", icon: "🦵", desc: "強化四頭肌，減少軟骨磨損，行樓梯唔痛" },
      { id: "back_1", title: "溫和腰背放鬆伸展", category: "BACK", duration: "10 分鐘", level: "初階", icon: "🧘", desc: "舒緩坐骨神經與下背僵硬" },
      { id: "shoulder_1", title: "五十肩旋轉活動度操", category: "SHOULDER", duration: "6 分鐘", level: "初階", icon: "💪", desc: "改善抬手困難，梳頭著衫更輕鬆" },
      { id: "cardio_1", title: "椅子安全踏步強心肺", category: "CARDIO", duration: "12 分鐘", level: "中階", icon: "❤️", desc: "增強心肺耐力，行路有氣有力" },
      { id: "knee_2", title: "進階站立平衡防跌訓練", category: "KNEE", duration: "10 分鐘", level: "進階", icon: "⚖️", desc: "鍛鍊小腿與核心，預防家居跌倒" }
    ];

    let currentSelectedWorkout = null;

    // 渲染運動列表
    function renderWorkouts(list) {
      const container = document.getElementById("workoutList");
      container.innerHTML = "";
      list.forEach(w => {
        const card = document.createElement("div");
        card.className = "workout-card";
        card.onclick = () => triggerWorkoutFlow(w);
        card.innerHTML = `
          <div class="workout-thumb">${w.icon}</div>
          <div class="workout-info">
            <div class="workout-title">${w.title}</div>
            <div class="workout-meta">⏱️ ${w.duration} ｜ 🎯 ${w.level}</div>
            <p style="font-size:16px; color:#64748B; margin-bottom:15px;">${w.desc}</p>
            <button class="start-btn">開始跟做 (AI 糾正)</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    renderWorkouts(WORKOUTS);

    // 篩選與搜尋
    function filterWorkout(cat) {
      document.querySelectorAll(".tag-btn").forEach(b => b.classList.remove("active"));
      event.target.classList.add("active");
      if (cat === "ALL") {
        renderWorkouts(WORKOUTS);
      } else {
        renderWorkouts(WORKOUTS.filter(w => w.category === cat));
      }
    }

    document.getElementById("workoutSearch").addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = WORKOUTS.filter(w => w.title.includes(q) || w.desc.includes(q));
      renderWorkouts(filtered);
    });

    /* =========================================
       殺手鐧 1: 運動前 3 題健康篩查 (PAR-Q 狀態機)
    ========================================= */
    const SCREENING_QUESTIONS = [
      "問題 1/3：今日身體有無頭暈或企唔穩？",
      "問題 2/3：胸口有無胸悶或者呼吸唔順？",
      "問題 3/3：今日血壓是否在正常範圍？"
    ];
    let screeningIndex = 0;

    function triggerWorkoutFlow(workout) {
      currentSelectedWorkout = workout;
      screeningIndex = 0;
      document.getElementById("screeningQuestionText").innerText = SCREENING_QUESTIONS[0];
      document.getElementById("screeningModal").style.display = "flex";
      speakCantonese(SCREENING_QUESTIONS[0]);
    }

    function handleScreeningAnswer(hasSymptom) {
      if (hasSymptom) {
        document.getElementById("screeningModal").style.display = "none";
        alert("⚠️ 溫馨提示：今日身體稍有不適，建議先坐低飲杯溫水休息，暫時唔好做運動。如果持續唔舒服請告知家人或就醫！");
        speakCantonese("今日身體唔舒服，請先坐低休息，唔好夾硬做運動。");
        return;
      }
      screeningIndex++;
      if (screeningIndex < SCREENING_QUESTIONS.length) {
        const nextQ = SCREENING_QUESTIONS[screeningIndex];
        document.getElementById("screeningQuestionText").innerText = nextQ;
        speakCantonese(nextQ);
      } else {
        // 全部通過，啟動 AI 鏡頭運動
        document.getElementById("screeningModal").style.display = "none";
        startExerciseWithAI();
      }
    }

    /* =========================================
       殺手鐧 2: MediaPipe Pose 端側即時 AI 姿態糾正
    ========================================= */
    let camera = null;
    let pose = null;

    function startExerciseWithAI() {
      document.getElementById("aiCameraModal").style.display = "flex";
      const videoElement = document.getElementById("cameraFeed");
      const canvasElement = document.getElementById("poseCanvas");
      const canvasCtx = canvasElement.getContext("2d");

      pose = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
      });

      pose.setOptions({
        modelComplexity: 0, // Lite 模型，舊款手機流暢唔發熱
        smoothLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      let lastSpeakTime = 0;

      pose.onResults((results) => {
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        if (results.poseLandmarks) {
          // 骨骼即時判定 (手腕 landmark 15,16 與肩膀 11,12)
          const leftWrist = results.poseLandmarks[15];
          const leftShoulder = results.poseLandmarks[11];
          const now = Date.now();

          // 簡單示範：檢查手有冇抬高
          if (leftWrist && leftShoulder && leftWrist.y < leftShoulder.y) {
            document.getElementById("aiVoiceFeedback").innerText = "🌟 手抬得好靚！保持平穩呼吸！";
            if (now - lastSpeakTime > 5000) {
              speakCantonese("手抬得好靚，保持住！");
              lastSpeakTime = now;
            }
          } else {
            document.getElementById("aiVoiceFeedback").innerText = "💡 婆婆/伯伯，隻手可以再抬高少少！";
          }
        }
        canvasCtx.restore();
      });

      camera = new Camera(videoElement, {
        onFrame: async () => {
          await pose.send({ image: videoElement });
        },
        width: 480,
        height: 360
      });
      camera.start();
    }

    function stopExerciseWithAI() {
      if (camera) camera.stop();
      document.getElementById("aiCameraModal").style.display = "none";
      // 進入運動後 RPE 評估
      document.getElementById("rpeModal").style.display = "flex";
      speakCantonese("做得好！做完運動覺得辛苦嗎？");
    }

    /* =========================================
       殺手鐧 3: 運動後 RPE 自評與資料寫入
    ========================================= */
    function submitRPE(score) {
      document.getElementById("rpeModal").style.display = "none";
      if (window.saveSessionToFirestore) {
        window.saveSessionToFirestore(score, currentSelectedWorkout?.id || "workout_general");
      }
      alert("🎉 今日運動記錄成功！連續天數已更新，繼續保持！");
      speakCantonese("今日好勤力！好好休息飲杯水。");
    }

    /* =========================================
       殺手鐧 4: SOS 3秒長按 + 10 秒倒數取消機制
    ========================================= */
    let sosTimerInterval = null;
    let sosSecondsRemaining = 10;
    let pressTimer = null;
    const sosBtn = document.getElementById("sosTriggerBtn");

    // 長按 3 秒防誤觸觸發
    sosBtn.addEventListener("pointerdown", () => {
      pressTimer = setTimeout(() => {
        startSOSCountdown();
      }, 3000);
    });
    sosBtn.addEventListener("pointerup", () => clearTimeout(pressTimer));
    sosBtn.addEventListener("pointerleave", () => clearTimeout(pressTimer));

    function startSOSCountdown() {
      if ("vibrate" in navigator) navigator.vibrate([400, 200, 400]);
      document.getElementById("sosModal").style.display = "flex";
      sosSecondsRemaining = 10;
      document.getElementById("sosTimer").innerText = sosSecondsRemaining;
      speakCantonese("求救訊號準備中，十秒內可按取消。");

      sosTimerInterval = setInterval(() => {
        sosSecondsRemaining--;
        document.getElementById("sosTimer").innerText = sosSecondsRemaining;
        if (sosSecondsRemaining <= 0) {
          clearInterval(sosTimerInterval);
          executeRealSOS();
        }
      }, 1000);
    }

    function abortSOS() {
      clearInterval(sosTimerInterval);
      document.getElementById("sosModal").style.display = "none";
      if (window.pushSOSAlertToFirestore) {
        window.pushSOSAlertToFirestore("CANCELLED");
      }
      alert("✅ 求救訊號已取消。");
    }

    function executeRealSOS() {
      document.getElementById("sosModal").style.display = "none";
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          const coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          if (window.pushSOSAlertToFirestore) window.pushSOSAlertToFirestore("ACTIVE", coords);
        });
      } else {
        if (window.pushSOSAlertToFirestore) window.pushSOSAlertToFirestore("ACTIVE");
      }
      alert("🚨 求救訊號已成功發出！已通知家人與緊急聯絡人！");
      speakCantonese("緊急求救訊號已發出，請保持冷靜。");
    }

    /* =========================================
       殺手鐧 5: 雙向語音辨識與粵語 TTS 朗讀
    ========================================= */
    function speakCantonese(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "zh-HK";
      utterance.rate = 0.9; // 語速稍慢適合長者
      window.speechSynthesis.speak(utterance);
    }

    function toggleVoiceAssistant() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("瀏覽器未支援語音識別，請使用 Chrome/Safari。");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = "zh-HK";
      recognition.onstart = () => speakCantonese("請講，想搵邊套運動？");
      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        handleSeniorVoiceIntent(transcript);
      };
      recognition.start();
    }

    function handleSeniorVoiceIntent(text) {
      // 0ms 快篩 Intent Router
      if (/(膝|腳痛|菠蘿蓋)/i.test(text)) {
        localStorage.setItem("lohas_last_symptom", "膝痛");
        filterWorkout("KNEE");
        speakCantonese("搵到護膝防跌操，撳一下就可以開始。");
      } else if (/(腰|背|坐骨)/i.test(text)) {
        localStorage.setItem("lohas_last_symptom", "腰背痛");
        filterWorkout("BACK");
        speakCantonese("為你搵到腰背放鬆伸展運動。");
      } else if (/(救命|跌親|好唔掂)/i.test(text)) {
        startSOSCountdown();
      } else {
        speakCantonese("收到！為你列出適合長者嘅健康運動。");
        renderWorkouts(WORKOUTS);
      }
    }

    function openPairingModal() {
      document.getElementById("pairingModal").style.display = "flex";
    }
    function closePairingModal(e) {
      if (e.target.id === "pairingModal") e.target.style.display = "none";
    }
  </script>
</body>
