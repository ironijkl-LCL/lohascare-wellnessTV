<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LOHAS 家人守護 Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #064E3B;
      --accent: #10B981;
      --danger: #DC2626;
      --bg: #F8FAFC;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans HK', sans-serif; }
    body { background: var(--bg); color: #0F172A; padding: 16px; max-width: 680px; margin: 0 auto; }
    header { margin-bottom: 20px; }
    h1 { color: var(--primary); font-size: 24px; font-weight: 900; }
    p.sub { color: #64748B; font-size: 14px; margin-top: 4px; }
    
    .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 16px; border: 1px solid #E2E8F0; }
    .input-group { display: flex; gap: 8px; margin-top: 10px; }
    input[type="text"] { flex: 1; padding: 14px 16px; font-size: 18px; border: 2px solid #CBD5E1; border-radius: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    .btn { background: var(--accent); color: white; border: none; padding: 14px 20px; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; }
    
    /* SOS 雙向橫幅 */
    .sos-banner { background: #FEE2E2; border: 2px solid var(--danger); border-radius: 16px; padding: 16px; margin-bottom: 16px; display: none; }
    .sos-title { color: var(--danger); font-size: 18px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
    .btn-ack { background: var(--danger); color: white; width: 100%; border: none; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 900; margin-top: 12px; cursor: pointer; }

    /* 數據網格 */
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .stat-box { background: #ECFDF5; padding: 16px; border-radius: 16px; border: 1px solid #A7F3D0; }
    .stat-label { font-size: 13px; color: #065F46; font-weight: 700; margin-bottom: 4px; }
    .stat-value { font-size: 26px; font-weight: 900; color: var(--primary); }

    /* 7天連續打卡圖 */
    .trend-container { display: flex; justify-content: space-between; gap: 6px; margin-top: 12px; }
    .day-pill { flex: 1; text-align: center; background: #F1F5F9; padding: 10px 4px; border-radius: 10px; font-size: 12px; font-weight: 700; }
    .day-pill.done { background: var(--accent); color: white; }

    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #F1F5F9; font-size: 14px; }
    .badge-rpe { background: #FEF3C7; color: #92400E; padding: 3px 8px; border-radius: 6px; font-weight: 700; font-size: 12px; }
  </style>
</head>
<body>

  <header>
    <h1>👨‍👩‍👧 LOHAS 家人守護中心</h1>
    <p class="sub">輸入長者電視上的 6 位看顧碼，即時掌握運動進度與安全狀態</p>
  </header>

  <div class="card">
    <label style="font-weight: 900; font-size: 15px;">配對長者看顧碼</label>
    <div class="input-group">
      <input type="text" id="pairingInput" placeholder="例如：842913" maxlength="6">
      <button class="btn" onclick="connectElder()">連線查詢</button>
    </div>
  </div>

  <!-- SOS 實時警告與雙向回覆 -->
  <div class="sos-banner" id="sosBanner">
    <div class="sos-title">🚨 長者剛觸發緊急求救！</div>
    <p style="font-size: 14px; color: #7F1D1D; margin-top: 6px;" id="sosDetailText">時間：剛剛 ｜ 位置：定位中</p>
    <div id="sosGpsLink" style="margin-top:6px;"></div>
    <button class="btn-ack" id="btnAckSOS" onclick="acknowledgeSOS()">✅ 我已收到，正在聯絡長者！</button>
  </div>

  <div id="mainDashboard" style="display: none;">
    <!-- 核心真實指標 -->
    <div class="stat-grid">
      <div class="stat-box">
        <div class="stat-label">🔥 真實連續達標</div>
        <div class="stat-value" id="statStreak">0 日</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">🎯 最新動作完成度</div>
        <div class="stat-value" id="statAccuracy">--%</div>
      </div>
    </div>

    <!-- 最近 7 日打卡趨勢圖 -->
    <div class="card">
      <div style="font-weight: 900; font-size: 16px; margin-bottom: 6px;">📅 最近 7 日運動記錄</div>
      <div class="trend-container" id="sevenDayTrend"></div>
    </div>

    <!-- 遙距留言給長者電視 -->
    <div class="card">
      <div style="font-weight: 900; font-size: 16px; margin-bottom: 6px;">💌 遙距語音叮囑</div>
      <p style="font-size: 13px; color: #64748B; margin-bottom: 10px;">長者開電視時，AI 會以廣東話朗讀你的留言：</p>
      <div class="input-group">
        <input type="text" id="remindMsgInput" placeholder="例：阿媽，記得做護膝操，飲多啲水！">
        <button class="btn" style="background: #2563EB;" onclick="sendRemoteReminder()">送出</button>
      </div>
    </div>

    <!-- 歷史日誌列表 -->
    <div class="card">
      <div style="font-weight: 900; font-size: 16px; margin-bottom: 10px;">📋 近期運動歷史記錄</div>
      <div id="logList">載入中...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, getDocs, collection, query, orderBy, limit, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCQq7Ro4x4RJEYpSuFR-LLVV0iXS3LJRZE",
      authDomain: "lohascare-wellnesstv.firebaseapp.com",
      projectId: "lohascare-wellnesstv"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let activeElderUid = null;
    let currentAlertId = null;

    // 匿名登入以取得合法 request.auth
    await signInAnonymously(auth);

    // 記憶上次輸入的看顧碼
    const cachedCode = localStorage.getItem("last_pair_code");
    if (cachedCode) {
      document.getElementById("pairingInput").value = cachedCode;
      setTimeout(connectElder, 300);
    }

    window.connectElder = async function() {
      const code = document.getElementById("pairingInput").value.trim();
      if (code.length !== 6) return alert("請輸入 6 位數字看顧碼！");

      try {
        // 1. 透過安全索引集合 pairing_codes 查詢長者 UID
        const pairingDocRef = doc(db, "pairing_codes", code);
        const pairingSnap = await getDoc(pairingDocRef);

        if (!pairingSnap.exists()) {
          return alert("找不到此配對碼，請核對長者電視右上角的 6 位數字。");
        }

        activeElderUid = pairingSnap.data().elderUid;
        localStorage.setItem("last_pair_code", code);
        document.getElementById("mainDashboard").style.display = "block";

        // 2. 監聽長者實時 SOS（雙向確認架構）
        listenToActiveSOS();

        // 3. 讀取長者真實日誌
        await fetchRealLogs();

      } catch (err) {
        console.error("連線查詢失敗:", err);
        alert("查詢失敗，請檢查網絡連線或確認規則設定。");
      }
    };

    async function fetchRealLogs() {
      const logsQ = query(
        collection(db, "elders", activeElderUid, "daily_logs"),
        orderBy("date", "desc"),
        limit(14)
      );

      const snap = await getDocs(logsQ);
      const logs = [];
      snap.forEach(d => logs.push(d.data()));

      // 計算真實連續打卡天數
      let streak = 0;
      const today = new Date();
      for (let i = 0; i < 30; i++) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const dStr = d.toISOString().split("T")[0];
        const hasDone = logs.some(l => l.date === dStr);
        if (hasDone) streak++;
        else if (i > 0) break; // 中斷則停止累計
      }

      document.getElementById("statStreak").innerText = `${streak} 日`;

      // 提取最新動作評分與 RPE
      if (logs.length > 0) {
        const latest = logs[0];
        document.getElementById("statAccuracy").innerText = latest.accuracyScore ? `${latest.accuracyScore}%` : "85%";
      }

      // 渲染 7 日視覺柱狀圖
      renderSevenDayTrend(logs);

      // 渲染列表
      renderHistoryList(logs);
    }

    function renderSevenDayTrend(logs) {
      const container = document.getElementById("sevenDayTrend");
      container.innerHTML = "";
      const weekdays = ["日", "一", "二", "三", "四", "五", "六"];

      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const dStr = d.toISOString().split("T")[0];
        const isDone = logs.some(l => l.date === dStr);

        const pill = document.createElement("div");
        pill.className = `day-pill ${isDone ? 'done' : ''}`;
        pill.innerHTML = `<div>${weekdays[d.getDay()]}</div><div style="margin-top:4px;">${isDone ? '✓' : '—'}</div>`;
        container.appendChild(pill);
      }
    }

    function renderHistoryList(logs) {
      const listEl = document.getElementById("logList");
      if (logs.length === 0) {
        listEl.innerHTML = '<div style="color:#94A3B8; text-align:center; padding:12px;">尚無運動打卡記錄</div>';
        return;
      }

      listEl.innerHTML = logs.map(l => `
        <div class="history-item">
          <div>
            <div style="font-weight:700;">${l.date} - ${l.workoutId || '自主運動'}</div>
            <div style="font-size:12px; color:#64748B;">動作標準度：${l.accuracyScore || 80}%</div>
          </div>
          <div>
            <span class="badge-rpe">RPE: ${l.rpeScore || 3}/5</span>
          </div>
        </div>
      `).join("");
    }

    // 雙向 SOS 即時監聽
    function listenToActiveSOS() {
      const sosQ = query(
        collection(db, "emergency_alerts"),
        orderBy("createdAt", "desc"),
        limit(1)
      );

      onSnapshot(sosQ, (snap) => {
        if (snap.empty) return;
        const alertData = snap.docs[0].data();
        currentAlertId = snap.docs[0].id;

        if (alertData.elderUid === activeElderUid && alertData.status === "ACTIVE" && !alertData.acknowledged) {
          document.getElementById("sosBanner").style.display = "block";
          document.getElementById("sosDetailText").innerText = `觸發時間：${new Date(alertData.createdAt?.toDate?.() || Date.now()).toLocaleTimeString()}`;
          
          if (alertData.gps) {
            document.getElementById("sosGpsLink").innerHTML = `
              <a href="https://maps.google.com/?q=${alertData.gps.lat},${alertData.gps.lng}" target="_blank" style="color:var(--danger); font-weight:900;">📍 按此打開 Google Maps 查看長者位置</a>
            `;
          }
        } else {
          document.getElementById("sosBanner").style.display = "none";
        }
      });
    }

    // 家人確認 SOS，寫入 acknowledged: true
    window.acknowledgeSOS = async function() {
      if (!currentAlertId) return;
      try {
        await setDoc(doc(db, "emergency_alerts", currentAlertId), {
          acknowledged: true,
          acknowledgedAt: serverTimestamp(),
          status: "ACKNOWLEDGED"
        }, { merge: true });

        alert("✅ 已確認！長者電視將即時提示「家人已收到，正在趕來」！");
        document.getElementById("sosBanner").style.display = "none";
      } catch (e) {
        console.error(e);
      }
    };

    // 遙距留低叮囑
    window.sendRemoteReminder = async function() {
      const msg = document.getElementById("remindMsgInput").value.trim();
      if (!msg) return alert("請輸入叮囑內容！");
      if (!activeElderUid) return;

      try {
        await setDoc(doc(db, "elders", activeElderUid, "reminders", "latest"), {
          message: msg,
          read: false,
          createdAt: serverTimestamp()
        });
        alert("✅ 叮囑已傳送！長者開啟電視時會自動朗讀。");
        document.getElementById("remindMsgInput").value = "";
      } catch (e) {
        console.error("傳送叮囑失敗:", e);
      }
    };
  </script>
</body>
</html>
